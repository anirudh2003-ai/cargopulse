x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow

  user: "${AIRFLOW_UID:-50000}:0"

  working_dir: /opt/cargopulse

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin

    PYTHONPATH: /opt/cargopulse

    DATABASE_URL: postgresql+psycopg2://cargopulse:cargopulse_dev@postgres:5432/cargopulse

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - .:/opt/cargopulse


services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: cargopulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cargopulse
      POSTGRES_USER: cargopulse
      POSTGRES_PASSWORD: cargopulse_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cargopulse -d cargopulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  airflow-postgres:
    image: postgres:16
    container_name: cargopulse-airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  airflow-init:
    <<: *airflow-common
    container_name: cargopulse-airflow-init

    command:
      - bash
      - -c
      - airflow db migrate

    depends_on:
      airflow-postgres:
        condition: service_healthy

      postgres:
        condition: service_healthy


  airflow-api-server:
    <<: *airflow-common
    container_name: cargopulse-airflow-api-server
    restart: unless-stopped

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy


  airflow-scheduler:
    <<: *airflow-common
    container_name: cargopulse-airflow-scheduler
    restart: unless-stopped

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy


  airflow-dag-processor:
    <<: *airflow-common
    container_name: cargopulse-airflow-dag-processor
    restart: unless-stopped

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy



  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cargopulse-api

    working_dir: /opt/cargopulse

    user: "${AIRFLOW_UID:-1000}:0"

    entrypoint:
      - uvicorn

    command:
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://cargopulse:cargopulse_dev@postgres:5432/cargopulse
      PYTHONPATH: /opt/cargopulse

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s



  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cargopulse-dashboard

    working_dir: /opt/cargopulse

    user: "${AIRFLOW_UID:-1000}:0"

    entrypoint:
      - streamlit

    command:
      - run
      - dashboard/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"

    environment:
      CARGOPULSE_API_URL: http://api:8000
      PYTHONPATH: /opt/cargopulse
      HOME: /tmp
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  cargopulse-cli:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cargopulse-cli

    working_dir: /opt/cargopulse

    user: "${AIRFLOW_UID:-1000}:0"

    environment:
      DATABASE_URL: postgresql+psycopg2://cargopulse:cargopulse_dev@postgres:5432/cargopulse
      PYTHONPATH: /opt/cargopulse

    volumes:
      - ./data:/opt/cargopulse/data

    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - tools


volumes:
  postgres_data:
  airflow_postgres_data:
