version: 2

models:

  - name: int_ais_position_zone_hits
    description: >
      All terminal-zone intersections for AIS observations.
      Multiple rows may exist for one AIS observation because
      CargoPulse operational geofences deliberately overlap.

    columns:

      - name: mmsi
        data_tests:
          - not_null

      - name: recorded_at
        data_tests:
          - not_null

      - name: zone_code
        data_tests:
          - not_null

      - name: zone_priority
        data_tests:
          - not_null


  - name: int_ais_position_primary_zone
    description: >
      One deterministic highest-priority operational zone for
      every AIS observation that intersects a terminal zone.

    columns:

      - name: mmsi
        data_tests:
          - not_null

      - name: recorded_at
        data_tests:
          - not_null

      - name: zone_code
        data_tests:
          - not_null

      - name: zone_priority
        data_tests:
          - not_null


  - name: int_ais_position_zone_state
    description: >
      Every cleaned AIS observation enriched with its primary
      terminal zone when one exists. Observations outside all
      terminal zones deliberately retain NULL zone attributes.

    columns:

      - name: mmsi
        data_tests:
          - not_null

      - name: recorded_at
        data_tests:
          - not_null


  - name: int_ais_zone_episodes
    description: >
      Continuous operational-zone episodes generated from AIS
      state transitions and a 20-minute reporting-gap threshold.

    columns:

      - name: mmsi
        data_tests:
          - not_null

      - name: episode_number
        data_tests:
          - not_null

      - name: zone_code
        data_tests:
          - not_null

      - name: episode_start
        data_tests:
          - not_null

      - name: episode_end
        data_tests:
          - not_null

      - name: point_count
        data_tests:
          - not_null
