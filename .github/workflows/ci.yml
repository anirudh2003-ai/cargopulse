name: CargoPulse CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  dbt-static:
    name: dbt static validation
    runs-on: ubuntu-latest

    env:
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: cargopulse
      DBT_PASSWORD: ci_placeholder
      DBT_DBNAME: cargopulse

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dbt dependencies
        run: |
          python -m pip install \
            -r requirements-airflow.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Parse dbt project
        run: |
          dbt parse \
            --project-dir dbt \
            --profiles-dir dbt/profiles

  compose-static:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        env:
          AIRFLOW_UID: "1000"
        run: docker compose config --quiet

  airflow-static:
    name: Airflow DAG validation
    runs-on: ubuntu-latest

    env:
      AIRFLOW_VERSION: "3.3.0"
      PYTHON_VERSION: "3.12"
      AIRFLOW_HOME: /tmp/cargopulse-airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Apache Airflow
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

          python -m pip install \
            "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "${CONSTRAINT_URL}"

      - name: Install CargoPulse Airflow dependencies
        run: |
          python -m pip install \
            -r requirements-airflow.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Validate DAG imports
        run: |
          set -o pipefail

          output="$(
            airflow dags list-import-errors \
              --local \
              2>&1
          )"

          printf '%s\n' "$output"

          printf '%s\n' "$output" \
            | grep -q '^No data found$'

  integration-smoke:
    name: PostGIS integration smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4

        env:
          POSTGRES_DB: cargopulse
          POSTGRES_USER: cargopulse
          POSTGRES_PASSWORD: cargopulse_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U cargopulse -d cargopulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: cargopulse
      PGUSER: cargopulse
      PGPASSWORD: cargopulse_ci

      DATABASE_URL: postgresql+psycopg2://cargopulse:cargopulse_ci@localhost:5432/cargopulse

      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: cargopulse
      DBT_PASSWORD: cargopulse_ci
      DBT_DBNAME: cargopulse

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-airflow.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            -r requirements-airflow.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialise CargoPulse database
        run: |
          psql \
            -v ON_ERROR_STOP=1 \
            -f database/schema.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -f database/create_terminal_zones.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -f database/create_vessel_registry.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -f database/create_vessel_enrichment_queue.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/ci_database.sql

      - name: Verify PostGIS
        run: |
          psql \
            -v ON_ERROR_STOP=1 \
            -c "SELECT PostGIS_Version();"

      - name: Run database validation
        run: |
          python -m pytest \
            tests/integration/test_pipeline_validation.py::test_database_validation_passes \
            -v

      - name: Build dbt staging layer
        run: |
          dbt build \
            --project-dir dbt \
            --profiles-dir dbt/profiles \
            --indirect-selection cautious \
            --select \
              stg_ais_positions \
              stg_terminal_zones \
              stg_confirmed_lng_port_calls

      - name: Validate staging outputs
        run: |
          test "$(
            psql -Atc \
              "SELECT COUNT(*) FROM dbt_dev.stg_ais_positions"
          )" = "2"

          test "$(
            psql -Atc \
              "SELECT COUNT(*) FROM dbt_dev.stg_terminal_zones"
          )" = "1"

          test "$(
            psql -Atc \
              "SELECT COUNT(*) FROM dbt_dev.stg_confirmed_lng_port_calls"
          )" = "1"

          echo "dbt staging outputs OK"

      - name: Verify FastAPI database health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from api.main import app

          with TestClient(app) as client:
              response = client.get("/health")

          assert response.status_code == 200, response.text

          print("FastAPI database health OK")
          PY
